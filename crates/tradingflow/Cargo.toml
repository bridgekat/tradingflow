[package]
name = "tradingflow"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []
python = ["dep:libc", "dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]

[dependencies]
tradingflow-data = { path = "../tradingflow-data", features = ["arrow"] }
tradingflow-graph = { path = "../tradingflow-graph" }
tradingflow-macros = { path = "../tradingflow-macros" }
num-traits = "0.2.19"
rand = { version = "0.10.2", features = ["thread_rng"] }
futures = { version = "0.3.33" }
bumpalo = "3.20.3"
statrs = "0.19.0"
arrow = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
libc = { version = "0.2.180", optional = true }
pyo3 = { version = "0.29.0", optional = true }
numpy = { version = "0.29.0", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
indicatif = "0.18.6"
clap = { version = "4.6.5", features = ["derive"] }
