[package]
name = "tradingflow"
version.workspace = true
edition.workspace = true
autoexamples = false

[lib]
crate-type = ["lib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "pyo3/auto-initialize"]

[dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
hifitime = "4"
pyo3 = { version = "0.29.0", optional = true }
numpy = { version = "0.29.0", optional = true }
num-traits = "0.2.19"
bumpalo = "3"
rand = { version = "0.10", features = ["thread_rng"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tradingflow-data = { path = "../tradingflow-data" }
tradingflow-graph = { path = "../tradingflow-graph" }
tradingflow-macros = { path = "../tradingflow-macros" }
arrow = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }

[dev-dependencies]
tempfile = "3"
pollster = "1.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
indicatif = "0.18"
clap = { version = "4", features = ["derive"] }

[[example]]
name = "plot_daily_price"
path = "../../examples/plot_daily_price.rs"

[[example]]
name = "plot_financial_data"
path = "../../examples/plot_financial_data.rs"

[[example]]
name = "plot_total_market_cap"
path = "../../examples/plot_total_market_cap.rs"

[[example]]
name = "mean_strategy"
path = "../../examples/mean_strategy.rs"
required-features = ["python"]

[[example]]
name = "mean_variance_strategy"
path = "../../examples/mean_variance_strategy.rs"
required-features = ["python"]

[[example]]
name = "benchmark_relative_strategy"
path = "../../examples/benchmark_relative_strategy.rs"
required-features = ["python"]

[[example]]
name = "covariance_gmv"
path = "../../examples/covariance_gmv.rs"
required-features = ["python"]

[[example]]
name = "factor_ic"
path = "../../examples/factor_ic.rs"
required-features = ["python"]
