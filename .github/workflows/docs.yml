name: Documentation

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Document the full public API, including the Python operator host
      # (`PyOperator`, `PyInterface`) and the operators built on it, all gated
      # behind `python`. `cargo doc` only compiles the crate (no execution or
      # link of an embedded interpreter), so PyO3 just needs the setup-python
      # interpreter on PATH. `--workspace` also builds the in-tree engine
      # crates' pages, which tradingflow's docs cross-link into.
      - run: cargo doc --no-deps --workspace --features python

      # `cargo doc` puts the crate index at target/doc/tradingflow/index.html, but
      # the artifact root is target/doc; add a root index that redirects there so
      # the Pages root URL lands on the crate docs.
      - run: echo '<meta http-equiv="refresh" content="0; url=tradingflow/index.html">' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

      - uses: actions/deploy-pages@v4
        id: deployment
