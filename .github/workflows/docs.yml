name: Documentation

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Document the full public API, including the optional embedded-Python
      # operator host (`PyClassOperator`, `add_py_*`, …) gated behind `python`.
      # `cargo doc` only compiles the crate (no execution/link of an embedded
      # interpreter), so PyO3 just needs the setup-python interpreter on PATH.
      # The second invocation adds the in-tree engine crate's own pages, which
      # tradingflow's docs cross-link into (same target/doc bundle).
      - run: cargo doc --no-deps --workspace --features python

      # `cargo doc` puts the crate index at target/doc/tradingflow/index.html, but
      # the artifact root is target/doc; add a root index that redirects there so
      # the Pages root URL lands on the crate docs.
      - run: echo '<meta http-equiv="refresh" content="0; url=tradingflow/index.html">' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

      - uses: actions/deploy-pages@v4
        id: deployment
