name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.14" ]
        platform: [ "ubuntu-latest", "macos-latest", "windows-latest" ]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Pure-Rust core (the whole workspace: the engine crates and
      # tradingflow itself): the default build pulls in NO Python toolchain.
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose

      # The bridge tests exchange NumPy arrays across the FFI boundary, so the
      # embedded interpreter's environment must be able to import numpy. It is
      # the only Python dependency — the repo ships no Python code of its own.
      - run: python -m pip install numpy
      - run: cargo test -p tradingflow --all-features --verbose

  miri:
    runs-on: ubuntu-latest
    env:
      # - Tree Borrows instead of the default Stacked Borrows: crossbeam's
      #   lock-free deque is a known false positive under Stacked Borrows.
      # - Leak check disabled: crossbeam-epoch's thread-local collector state
      #   is reported as leaked at process exit.
      # - Isolation disabled: the driver tests read the system clock.
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-ignore-leaks

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Interpret the unsafe-heavy crates under Miri.
      - run: cargo miri test -p tradingflow-graph --verbose
