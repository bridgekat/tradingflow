name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        python: ['3.13']
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Rust crate: the flow engine + operator library.
      - run: cargo test --lib

      # flowops Python operator package (pure Python) + its tests.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
