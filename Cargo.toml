[package]
name = "tradingflow"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
ndarray = "0.17.2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "fs",
] }
hifitime = "4"
# Embedded CPython for the Python operators (`src/operators/python.rs` /
# `pyhost.rs`). `auto-initialize` boots the interpreter on first use; build with
# PYO3_PYTHON pointing at the target interpreter (a free-threaded build gives
# pure-Python parallelism; on a GIL build, numpy/scipy/cvxpy still release the GIL).
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
numpy = "0.28.0"
num-traits = "0.2.19"
csv = "1.3"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
# New synchronous parallel engine (migration branch: see `flow` module).
# Vendored as a git submodule -> https://github.com/bridgekat/flowgraph
flowgraph = { path = "extern/flowgraph" }
arrow = "58.3.0"
parquet = { version = "58.3.0", features = ["arrow", "zstd"] }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
tempfile = "3"
# tqdm-style progress bars for the examples (see `examples/common::progress`).
indicatif = "0.17"

# Examples are auto-discovered from `examples/*.rs`. They all build against the
# (now unconditional) embedded interpreter; the operator-heavy ones additionally
# need NumPy/SciPy/cvxpy + `flowops` importable at runtime — see examples/README.md.

