[package]
name = "tradingflow"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[profile.profiling]
inherits = "release"
debug = true

[features]
default = []
# `flow` Python operators: Rust-driven embedding on a single interpreter with
# real NumPy (`src/flow/python.rs`). Build against a free-threaded interpreter
# (PYO3_PYTHON -> python3.13t) for true pure-Python parallelism; on a standard
# GIL build, numpy/scipy/cvxpy still parallelise across operators via GIL release.
pyflow = ["dep:pyo3", "dep:numpy", "pyo3/auto-initialize"]

[dependencies]
ndarray = "0.17.2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "fs",
] }
hifitime = "4"
pyo3 = { version = "0.28.2", optional = true }
numpy = { version = "0.28.0", optional = true }
num-traits = "0.2.19"
csv = "1.3"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
# New synchronous parallel engine (migration branch: see `flow` module).
# Vendored as a git submodule -> https://github.com/bridgekat/flowgraph
flowgraph = { path = "extern/flowgraph" }
arrow = "58.3.0"
parquet = { version = "58.3.0", features = ["arrow", "zstd"] }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
tempfile = "3"
# tqdm-style progress bars for the examples (see `examples/common::progress`).
indicatif = "0.17"

[[example]]
name = "flowops_demo"
required-features = ["pyflow"]

