[package]
name = "tradingflow"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[profile.profiling]
inherits = "release"
debug = true

[features]
default = []
# Python operators (optional): the engine embeds a CPython interpreter to run
# `flowops` operators (`src/operators/python.rs` / `pyhost.rs`). The pure-Rust
# engine + native operators build WITHOUT a Python toolchain; enabling `python`
# links libpython, so set PYO3_PYTHON (see examples/env.ps1). A free-threaded
# interpreter gives pure-Python parallelism; on a GIL build, numpy/scipy/cvxpy
# still release the GIL across operators.
python = ["dep:pyo3", "dep:numpy", "pyo3/auto-initialize"]

[dependencies]
ndarray = "0.17.2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "fs",
] }
hifitime = "4"
pyo3 = { version = "0.28.2", optional = true }
numpy = { version = "0.28.0", optional = true }
num-traits = "0.2.19"
# Seeded RNG for the RandomTrader operator (src/operators/traders.rs).
rand = "0.8"
csv = "1.3"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
# New synchronous parallel engine (migration branch: see `flow` module).
# Vendored as a git submodule -> https://github.com/bridgekat/flowgraph
flowgraph = { path = "extern/flowgraph" }
arrow = "58.3.0"
parquet = { version = "58.3.0", features = ["arrow", "zstd"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
# tqdm-style progress bars for the examples (see `examples/common::progress`).
indicatif = "0.17"

[[example]]
name = "flowops_demo"
required-features = ["python"]

[[example]]
name = "plot_daily_price"

[[example]]
name = "plot_financial_data"

[[example]]
name = "plot_total_market_cap"

