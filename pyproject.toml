[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingflow"
version = "0.1.0"
description = "Operator library for TradingFlow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "scipy",
    "cvxpy",
    "scs",
    "pyarrow>=25.0.0",
    "tqdm>=4.69.0",
]

# `tradingflow` is the Python operator package (predictor / portfolio / metric)
# run by the Rust crate's embedded interpreter. It is the only Python package
# the project ships — the Rust core is a plain library crate. The operators are
# tested through the engine, in the crate's integration tests, so there is no
# Python test suite here.
[tool.hatch.build.targets.wheel]
packages = ["python/tradingflow"]

[tool.black]
line-length = 120
