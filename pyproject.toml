[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingflow"
version = "0.1.0"
description = "A lightweight library for quantitative investment research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.4", "pandas>=3.0", "scipy", "cvxpy", "scs"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
examples = [
    # Vendored as a git submodule at extern/a-shares-crawler (see .gitmodules);
    # installed from the local working tree rather than a pinned GitHub commit.
    # Generates the A-shares market data the `examples/` strategies read.
    "a-shares-crawler @ file:extern/a-shares-crawler",
    # The example plot scripts (examples/plot*.py) render the engine's CSV output.
    "matplotlib",
]

# `flowops` is the Python operator package (predictors / portfolios /
# metrics) run by the Rust `flow` engine's embedded interpreter. It is the only
# Python package the project ships now — the Rust core is a plain library crate
# (the legacy Python-as-host `_native` extension and its maturin build are gone).
[tool.hatch.build.targets.wheel]
packages = ["python/flowops"]

[tool.pytest.ini_options]
testpaths = ["python/flowops/tests"]

[tool.black]
line-length = 120
