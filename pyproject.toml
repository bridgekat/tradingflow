[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tradingflow"
version = "0.1.0"
description = "A lightweight library for quantitative investment research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.4", "pandas>=3.0", "scipy", "cvxpy", "scs"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "zensical", "mkdocstrings-python"]
examples = [
    # Vendored as a git submodule at extern/a-shares-crawler (see .gitmodules);
    # installed from the local working tree rather than a pinned GitHub commit.
    "a-shares-crawler @ file:extern/a-shares-crawler",
    "matplotlib",
    "streamlit[charts]",
    "tqdm",
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
python-source = "python/src"
module-name = "tradingflow._native"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.black]
line-length = 120
