[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingflow"
version = "0.1.0"
description = "A lightweight library for quantitative investment research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.4", "pandas>=3.0", "scipy", "cvxpy", "scs"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
examples = [
    # Generates the A-shares market data the `examples/` strategies read.
    # Pinned to a GitHub commit (was a git submodule at extern/a-shares-crawler);
    # pip fetches it on demand, so no submodule checkout is needed.
    "a-shares-crawler @ git+https://github.com/bridgekat/a-shares-crawler.git@1aad4af7909411154662eaa2e913f106beaa2a97",
    # The example plot scripts (examples/plot*.py) render the engine's CSV output.
    "matplotlib",
]

# `flowops` is the Python operator package (predictors / portfolios /
# metrics) run by the Rust crate's embedded interpreter. It is the only
# Python package the project ships now — the Rust core is a plain library crate
# (the legacy Python-as-host `_native` extension and its maturin build are gone).
[tool.hatch.build.targets.wheel]
packages = ["python/flowops"]

# The `examples` extra pins a-shares-crawler by a `git+https` URL (a PEP 508
# direct reference); hatchling rejects direct references during metadata
# generation unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["python/flowops/tests"]

[tool.black]
line-length = 120
