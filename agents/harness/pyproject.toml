[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "general-research"
version = "0.1.0"
description = "A simple general-purpose quant research and coding agent built on the OpenAI Agents SDK, pointed at the DeepSeek API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.18",
    "python-dotenv>=1.0",
    "ripgrep>=14",
    "ddgs>=9",
    "httpx>=0.27",
]

[project.scripts]
general-research = "general_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["general_research"]
